<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Catálogo de Videojuegos</title>

    <link rel="stylesheet" href="/css/estilos.css">
</head>

<body>

    <header>
        <a class="regreso" href="http://localhost:8081/videojuegos"><h1>Catálogo de Videojuegos</h1> </a>
    </header>

    <main>
             

        <form method="get"th:action="@{/videojuegos}"> 
            <input type="text" name="buscar" th:value="${buscar}" placeholder="Buscar...">
            <button class="buscar" type="submit">Buscar</button>
        </form>

      

        <p th:if="${#lists.isEmpty(nombre)}">No hay vidojuegos que coincidan que coincidan.</p>
              
        <p class="bienvenida">Bienvenidos a <span>GameCatalog</span> te presentamos nuestro catalogo:</p>

        <ul class="lista-juegos">
            
            <li class="tarjeta-juego" th:each="videojuego : ${nombre}">
            <a th:href="@{/videojuegos/ficha/{id}(id=${videojuego.id})}" th:text="${videojuego.nombre}">Nombre</a>
            
            <!-- <hr><span th:text="${videojuego.genero}">Accion</span> -->
            <hr><img th:src="${videojuego.imagen}" th:alt="${videojuego.nombre}" class="imagen-juego">
            </li>

        </ul>
        
    </main>

    <footer> <p>© 2026 GameCatalog</p> </footer>
</body>

</html>
