<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha de Videojuego</title>
     <link rel="stylesheet" href="/css/estilos.css">
</head>
<body>
    <header></header>

     <main class="ficha-juego">

        <a th:href="@{/videojuegos}" class="regreso">
            ← Volver al catálogo
        </a>

        <h2 class="nombre-ficha" th:text="${videojuego.nombre}">Nombre del videojuego</h2>

        <img class="imagen-ficha"
             th:src="${videojuego.imagen}"
             th:alt="${videojuego.nombre}">

        <section class="detalles-juego">
            <p>
                <strong>Plataforma:</strong>
                <span th:text="${videojuego.plataforma}">PC</span>
            </p>

            <p>
                <strong>Género:</strong>
                <span th:text="${videojuego.genero}">Acción</span>
            </p>

            <p>
                <strong>Precio:</strong>
                <span th:text="${videojuego.precio}">0</span>
            </p>
        </section>

    </main>


<footer></footer>
</body>
</html>
