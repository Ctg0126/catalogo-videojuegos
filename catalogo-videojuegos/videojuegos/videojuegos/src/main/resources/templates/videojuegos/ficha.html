<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/comunes :: cabeza('Info')}"></head>
<body>
   <header th:replace="~{fragmentos/comunes :: cabecera}"></header>

     <main class="ficha-juego">

        <a th:href="@{/videojuegos}" class="regreso">
            ← Volver al catálogo
        </a>

        <h2 class="nombre-ficha" th:text="${videojuego.nombre}">Nombre del videojuego</h2>

        <img class="imagen-ficha" th:src="${videojuego.imagen != null
                ? videojuego.imagen
                : '/img/sin-portada.svg'}" alt="Portada del videojuego">

        <section class="detalles-juego">
            <p>
                <strong>Plataforma:</strong>
                <span th:text="${videojuego.plataforma}">PC</span>
            </p>

            <p>
                <strong>Género:</strong>
                <span th:text="${videojuego.genero}">Acción</span>
            </p>

            <p>
                <strong>Precio:</strong>
                <span th:text="${videojuego.precio}">0</span>
            </p>
        </section>

    </main>


<footer th:replace="~{fragmentos/comunes :: pie}"></footer>
</body>
</html>
